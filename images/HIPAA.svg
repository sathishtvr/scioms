<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- Gradients for the 3D metallic outer ring -->
        <linearGradient id="outerBevel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f4f6f8"/>
            <stop offset="25%" stop-color="#b8c3cd"/>
            <stop offset="50%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#8d9dae"/>
            <stop offset="100%" stop-color="#5a6b7d"/>
        </linearGradient>
        
        <linearGradient id="innerBevel" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#697a8c"/>
            <stop offset="40%" stop-color="#ccd5df"/>
            <stop offset="60%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#a4b2c1"/>
        </linearGradient>

        <!-- Paths for the circular text -->
        <path id="arc-top" d="M 39 100 A 61 61 0 1 1 161 100" fill="none" />
        <path id="arc-bot" d="M 26 100 A 74 74 0 0 0 174 100" fill="none" />
    </defs>

    <!-- Outer metallic edge -->
    <circle cx="100" cy="100" r="95" fill="url(#outerBevel)" />
    <!-- Inner slope of metallic edge -->
    <circle cx="100" cy="100" r="89" fill="url(#innerBevel)" />
    
    <!-- Outer White border -->
    <circle cx="100" cy="100" r="84" fill="#ffffff" />
    
    <!-- Main Blue background -->
    <circle cx="100" cy="100" r="81" fill="#3979C0" />

    <!-- Inner thin metallic ring -->
    <circle cx="100" cy="100" r="54" fill="none" stroke="url(#outerBevel)" stroke-width="2" />

    <!-- Circular Text -->
    <text fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" letter-spacing="1.2">
        <textPath href="#arc-top" startOffset="50%" text-anchor="middle">HIPAA ALIGNED</textPath>
    </text>
    <text fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="12" letter-spacing="1">
        <textPath href="#arc-bot" startOffset="50%" text-anchor="middle">COMPLIANCE VERIFIED</textPath>
    </text>

    <!-- Center Medical Cross -->
    <path d="M 85 52 H 115 V 85 H 148 V 115 H 115 V 148 H 85 V 115 H 52 V 85 H 85 Z" fill="#ffffff" />

    <!-- Caduceus Symbol -->
    <g id="caduceus">
        <!-- Central Staff & Top Ball -->
        <rect x="98.5" y="58" width="3" height="76" fill="#3979C0" />
        <circle cx="100" cy="54" r="4.5" fill="#3979C0" />

        <!-- Wings -->
        <path d="M 98 60 
                 C 80 55, 66 65, 62 73 
                 C 70 71, 78 68, 86 67 
                 C 76 72, 70 77, 67 83
                 C 78 78, 86 73, 98 67 Z" fill="#3979C0"/>
        <path d="M 102 60 
                 C 120 55, 134 65, 138 73 
                 C 130 71, 122 68, 114 67 
                 C 124 72, 130 77, 133 83
                 C 122 78, 114 73, 102 67 Z" fill="#3979C0"/>

        <!-- Intertwined Snakes -->
        <path d="M 88,77 C 95,71 100,79 100,85 C 100,91 110,89 110,96 C 110,103 100,101 100,107 C 100,113 88,111 88,118 C 88,125 100,123 100,129 C 100,133 94,135 94,135" fill="none" stroke="#3979C0" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 112,77 C 105,71 100,79 100,85 C 100,91 90,89 90,96 C 90,103 100,101 100,107 C 100,113 112,111 112,118 C 112,125 100,123 100,129 C 100,133 106,135 106,135" fill="none" stroke="#3979C0" stroke-width="2.5" stroke-linecap="round"/>
        
        <!-- Snake Heads -->
        <circle cx="87.5" cy="77" r="2.2" fill="#3979C0"/>
        <circle cx="112.5" cy="77" r="2.2" fill="#3979C0"/>
    </g>
</svg>
